<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"></meta>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"></meta>
    <title>EDMS Search Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-form {
            padding: 30px;
            background: #f8f9fa;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 0.95em;
        }

        .form-group select,
        .form-group input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .results-section {
            padding: 30px;
        }

        .message {
            padding: 15px 20px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .message-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .message-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .results-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
        }

        .results-info strong {
            color: #667eea;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
            padding: 20px;
        }

        .pagination button {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .pagination button:hover:not(:disabled) {
            background: #667eea;
            color: white;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination span {
            padding: 10px 20px;
            font-weight: 600;
            color: #333;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 EDMS Search Application</h1>
            <p>Search and retrieve EDMS data across multiple loan journeys</p>
        </div>

        <div class="search-form">
            <form th:action="@{/search}" method="post" th:object="${searchRequest}">
                <div class="form-row">
                    <div class="form-group">
                        <label for="journeyName">Journey Name *</label>
                        <select id="journeyName" th:field="*{journeyName}" required="required">
                            <option value="">-- Select Journey --</option>
                            <option th:each="journey : ${journeys}" 
                                    th:value="${journey}" 
                                    th:text="${#strings.capitalize(#strings.replace(journey, 'Loan', ' Loan'))}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="cif">CIF Number</label>
                        <input type="text" id="cif" th:field="*{cif}" placeholder="Enter CIF Number" />
                    </div>

                    <div class="form-group">
                        <label for="accountNumber">Account Number</label>
                        <input type="text" id="accountNumber" th:field="*{accountNumber}" placeholder="Enter Account Number" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="docId">Document ID</label>
                        <input type="text" id="docId" th:field="*{docId}" placeholder="Enter Document ID" />
                    </div>

                    <div class="form-group">
                        <label for="referenceId">Reference ID</label>
                        <input type="text" id="referenceId" th:field="*{referenceId}" placeholder="Enter Reference ID" />
                    </div>

                    <div class="form-group">
                        <label for="fromDate">From Date</label>
                        <input type="date" id="fromDate" th:field="*{fromDate}" />
                    </div>

                    <div class="form-group">
                        <label for="toDate">To Date</label>
                        <input type="date" id="toDate" th:field="*{toDate}" />
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">🔍 Search</button>
                    <button type="reset" class="btn btn-secondary">🔄 Reset</button>
                </div>
            </form>
        </div>

        <div class="results-section" th:if="${response != null}">
            <div th:if="${response.message != null}" 
                 th:class="${response.totalRecords == 0 ? 'message message-warning' : 'message message-info'}"
                 th:text="${response.message}">
            </div>

            <div th:if="${response.records != null and !response.records.isEmpty()}">
                <div class="results-info">
                    <span>
                        Showing <strong th:text="${response.records.size()}">0</strong> records 
                        (Page <strong th:text="${response.currentPage + 1}">1</strong> of 
                        <strong th:text="${response.totalPages}">1</strong>)
                    </span>
                    <span>
                        Total Records: <strong th:text="${response.totalRecords}">0</strong>
                    </span>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th th:each="column : ${columns}" th:text="${#strings.capitalize(column)}">Column</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="record : ${response.records}">
                                <td th:each="column : ${columns}" th:text="${record.get(column)}">Value</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="pagination" th:if="${response.totalPages > 1}">
                    <form th:action="@{/search}" method="post" style="display: inline;">
                        <input type="hidden" name="journeyName" th:value="${searchRequest.journeyName}" />
                        <input type="hidden" name="cif" th:value="${searchRequest.cif}" />
                        <input type="hidden" name="accountNumber" th:value="${searchRequest.accountNumber}" />
                        <input type="hidden" name="docId" th:value="${searchRequest.docId}" />
                        <input type="hidden" name="referenceId" th:value="${searchRequest.referenceId}" />
                        <input type="hidden" name="fromDate" th:value="${searchRequest.fromDate}" />
                        <input type="hidden" name="toDate" th:value="${searchRequest.toDate}" />
                        <input type="hidden" name="page" th:value="${response.currentPage - 1}" />
                        <button type="submit" th:disabled="${!response.hasPrevious}">← Previous</button>
                    </form>

                    <span th:text="'Page ' + ${response.currentPage + 1} + ' of ' + ${response.totalPages}">Page 1 of 1</span>

                    <form th:action="@{/search}" method="post" style="display: inline;">
                        <input type="hidden" name="journeyName" th:value="${searchRequest.journeyName}" />
                        <input type="hidden" name="cif" th:value="${searchRequest.cif}" />
                        <input type="hidden" name="accountNumber" th:value="${searchRequest.accountNumber}" />
                        <input type="hidden" name="docId" th:value="${searchRequest.docId}" />
                        <input type="hidden" name="referenceId" th:value="${searchRequest.referenceId}" />
                        <input type="hidden" name="fromDate" th:value="${searchRequest.fromDate}" />
                        <input type="hidden" name="toDate" th:value="${searchRequest.toDate}" />
                        <input type="hidden" name="page" th:value="${response.currentPage + 1}" />
                        <button type="submit" th:disabled="${!response.hasNext}">Next →</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
