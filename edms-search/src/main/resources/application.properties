# Server Configuration
server.port=8080
server.context-path=/edms-search

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:edmsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Application Configuration
app.page.size=100

# Journey Configuration
# Format: journey.{journeyName}.table={tableName}
# Format: journey.{journeyName}.columns={comma-separated column names}
# Format: journey.{journeyName}.searchColumns={comma-separated searchable column names}
# Format: journey.{journeyName}.columnMapping.{logicalName}={actualColumnName}
#
# Column Mapping allows you to map logical field names to actual database column names
# Logical names: cif, accountNumber, docId, referenceId, uploadDate
# If no mapping is provided, the logical name will be used as the column name

# Home Loan Journey
journey.homeLoan.table=HOME_LOAN_EDMS
journey.homeLoan.columns=id,cif,accountNumber,docId,referenceId,documentType,uploadDate,status
journey.homeLoan.searchColumns=cif,accountNumber,docId,referenceId
# Column mappings (using default column names, no mapping needed)
journey.homeLoan.columnMapping.cif=cif
journey.homeLoan.columnMapping.accountNumber=accountNumber
journey.homeLoan.columnMapping.docId=docId
journey.homeLoan.columnMapping.referenceId=referenceId
journey.homeLoan.columnMapping.uploadDate=uploadDate

